[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则-在线更新版

;去广告：支持
;自动测速：支持
;微软分流：不支持
;苹果分流：不支持
;增强中国IP段：支持
;增强国外GFW：不支持

;设置规则标志位
ruleset=🛑 广告拦截,[]GEOSITE,category-ads-all
ruleset=🏠 私有网络,[]GEOSITE,private
ruleset=🏠 私有网络,[]GEOIP,private,no-resolve
ruleset=🔒 国内服务,[]GEOSITE,geolocation-cn
ruleset=🔒 国内服务,[]GEOIP,cn,no-resolve
ruleset=🌍 非中国,[]GEOSITE,geolocation-!cn
ruleset=🔒 国内服务,[]GEOSITE,cn
ruleset=🐟 漏网之鱼,[]FINAL
;设置规则标志位

;设置分组标志位
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🏠 私有网络`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🔒 国内服务`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🌍 非中国`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT`.*
;设置分组标志位

enable_rule_generator=true
overwrite_original_rules=true
